plugins {
    id 'com.android.application'
}

android {
    namespace 'com.you.chargestatus'
    compileSdk 34

    defaultConfig {
        applicationId "com.you.chargestatus"
        minSdk 31
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // Sign with the debug key so the release APK is directly installable.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
